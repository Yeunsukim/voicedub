[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedub"
version = "0.1.0"
description = "대본을 내 목소리로 읽어주는 음성 변환 프로그램 (XTTS-v2 보이스 클로닝)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "coqui-tts>=0.27",
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
ui = ["gradio>=4"]
dev = ["pytest"]

[project.scripts]
voicedub = "voicedub.cli:main"

[tool.setuptools]
packages = ["voicedub"]
